name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（含 dev 工具链）
        run: uv sync --group dev

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format 校验
        run: uv run ruff format --check .

      - name: Mypy 类型检查（尽力而为，失败不阻塞）
        run: uv run mypy main.py || true
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --group dev

      - name: 运行测试
        run: uv run pytest tests/ -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    # 仅 main 分支推送时验证镜像可构建；PR 阶段跳过以节省资源（镜像构建较重）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（验证 Dockerfile）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finrag:ci
